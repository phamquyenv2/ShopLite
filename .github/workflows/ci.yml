name: ShopLite CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  GCP_PROJECT_ID: shoplite-36f6c
  GCP_REGION: asia-southeast1
  ARTIFACT_REGISTRY_REPOSITORY: shoplite
  CLOUD_RUN_SERVICE: shoplite-api
  IMAGE_NAME: shoplite-api
  FIREBASE_PROJECT_ID: shoplite-36f6c

concurrency:
  group: shoplite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # 1. Build & Test Backend
  # ──────────────────────────────────────────────
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/shoplite

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/shoplite/build/reports/tests/
          retention-days: 7

  # ──────────────────────────────────────────────
  # 2. Build Frontend
  # ──────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/shopliteapp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/shopliteapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────
  # 3. Preview Frontend (PR only)
  # ──────────────────────────────────────────────
  preview-frontend:
    name: Preview Frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: frontend/shopliteapp
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/shopliteapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy Firebase Hosting preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: pr-${{ github.event.pull_request.number }}
          entryPoint: frontend/shopliteapp

  # ──────────────────────────────────────────────
  # 4. Deploy Backend to Cloud Run
  # ──────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push Docker image
        id: image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          LATEST_IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
        run: |
          docker build -t "$IMAGE_URI" -t "$LATEST_IMAGE_URI" backend/shoplite
          docker push "$IMAGE_URI"
          docker push "$LATEST_IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ steps.image.outputs.uri }}
          flags: >-
            --allow-unauthenticated
            --memory=2Gi
            --cpu=2
            --timeout=300
            --min-instances=1
            --max-instances=10
            --concurrency=40
            --cpu-boost
          env_vars: |
            SERVER_PORT=8080
            SPRING_PROFILES_ACTIVE=prod
            SHOPLITE_FIREBASE_ENABLED=true
            TWILIO_ENABLED=false
            SHOPLITE_CORS_ALLOWED_ORIGIN_PATTERNS=https://localhost,http://localhost:4173,http://localhost:5173,http://localhost:8100,https://*.web.app,https://*.firebaseapp.com
            SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
            SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
            SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            DB_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
            DB_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            SEPAY_WEBHOOK_SECRET=${{ secrets.SEPAY_WEBHOOK_SECRET }}
            MOMO_PARTNER_CODE=${{ secrets.MOMO_PARTNER_CODE }}
            MOMO_ACCESS_KEY=${{ secrets.MOMO_ACCESS_KEY }}
            MOMO_SECRET_KEY=${{ secrets.MOMO_SECRET_KEY }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_FROM_NUMBER=${{ secrets.TWILIO_FROM_NUMBER }}
            FIREBASE_CREDENTIALS_JSON=${{ secrets.FIREBASE_CREDENTIALS_JSON }}

  # ──────────────────────────────────────────────
  # 5. Deploy Frontend to Firebase Hosting
  # ──────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Firebase
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    defaults:
      run:
        working-directory: frontend/shopliteapp
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/shopliteapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: frontend/shopliteapp
