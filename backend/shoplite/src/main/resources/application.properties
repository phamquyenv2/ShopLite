spring.application.name=shoplite

spring.datasource.url=jdbc:mysql://localhost:3306/shoplitedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Cache (Caffeine)
spring.cache.type=caffeine
spring.cache.cache-names=categories,units,permissions,products

# JWT Configuration
shoplite.jwt.base64-secret=${JWT_SECRET_KEY}
shoplite.jwt.access-token-expiration=86400
shoplite.jwt.refresh-token-expiration=604800
shoplite.time-zone=Asia/Ho_Chi_Minh
shoplite.attendance.auto-close-cron=0 */15 * * * *

logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.servlet.mvc.method.annotation=DEBUG

# SpringDoc OpenAPI
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true

# SePay Configuration
shoplite.sepay.bank-account=383870916
shoplite.sepay.bank-code=NamABank
shoplite.sepay.account-name=PHAM ANH QUYEN
shoplite.sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET}
shoplite.sepay.qr-expire-minutes=15

# MoMo Configuration
shoplite.momo.partnerCode=${MOMO_PARTNER_CODE}
shoplite.momo.accessKey=${MOMO_ACCESS_KEY}
shoplite.momo.secretKey=${MOMO_SECRET_KEY}
shoplite.momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
shoplite.momo.returnUrl=http://localhost:8100/checkout-success
shoplite.momo.notifyUrl=https://calculated-whilst-more-gods.trycloudflare.com/api/v1/payment/webhook/momo

# 🔔 Firebase FCM Configuration
# 1. Tải firebase-service-account.json từ Firebase Console (Settings > Service Accounts > Generate New Private Key)
# 2. Lưu vào backend/shoplite/src/main/resources/
# 3. Để shoplite.firebase.enabled=true để gửi thật, hoặc =false để MOCK (xem console log)
shoplite.firebase.enabled=true
shoplite.firebase.credentials-file=src/main/resources/firebase-service-account.json
shoplite.firebase.credentials-json=


shoplite.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
shoplite.cloudinary.api-key=${CLOUDINARY_API_KEY}
shoplite.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Twilio Configuration (SMS OTP)
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.from-number=${TWILIO_FROM_NUMBER}
twilio.enabled=true

# OTP Configuration
shoplite.otp.expiry-seconds=60
shoplite.otp.resend-cooldown-seconds=60
shoplite.otp.max-send-per-hour=10
shoplite.otp.max-attempts=5

# Registration Session
shoplite.registration.session-expiry-seconds=300
