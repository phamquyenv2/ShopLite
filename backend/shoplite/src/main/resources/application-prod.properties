spring.application.name=shoplite
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:3000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

spring.lifecycle.timeout-per-shutdown-phase=15s

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

shoplite.jwt.access-token-expiration=86400
shoplite.jwt.refresh-token-expiration=604800
shoplite.time-zone=Asia/Ho_Chi_Minh
shoplite.attendance.auto-close-cron=0 */15 * * * *

shoplite.jwt.base64-secret=${JWT_SECRET_KEY}
shoplite.cors.allowed-origin-patterns=${SHOPLITE_CORS_ALLOWED_ORIGIN_PATTERNS:https://localhost,http://localhost:4173,http://localhost:5173,http://localhost:8100,https://*.web.app,https://*.firebaseapp.com}
shoplite.cors.max-age=${SHOPLITE_CORS_MAX_AGE:3600}

shoplite.firebase.enabled=${SHOPLITE_FIREBASE_ENABLED:false}
shoplite.firebase.credentials-file=
shoplite.firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}

twilio.account-sid=${TWILIO_ACCOUNT_SID:test}
twilio.auth-token=${TWILIO_AUTH_TOKEN:test}
twilio.from-number=${TWILIO_FROM_NUMBER:test}
twilio.enabled=${TWILIO_ENABLED:false}

shoplite.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:test}
shoplite.cloudinary.api-key=${CLOUDINARY_API_KEY:test}
shoplite.cloudinary.api-secret=${CLOUDINARY_API_SECRET:test}

shoplite.sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET:test}

shoplite.momo.partnerCode=${MOMO_PARTNER_CODE:test}
shoplite.momo.accessKey=${MOMO_ACCESS_KEY:test}
shoplite.momo.secretKey=${MOMO_SECRET_KEY:test}
shoplite.momo.returnUrl=${MOMO_RETURN_URL:}
shoplite.momo.notifyUrl=${MOMO_NOTIFY_URL:}
